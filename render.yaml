services:
  - type: web
    name: sabrey-menu
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SERVE_FRONTEND
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_ENABLED
        value: "true"

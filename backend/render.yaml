services:
  - type: web
    name: sabrey-menu
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: SERVE_FRONTEND
        value: "false"
      - key: ENABLE_DOCS
        value: "false"
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_ENABLED
        value: "true"
      - key: DB_SSL_CA_PEM
        sync: false
